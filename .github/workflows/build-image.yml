name: Build image

# Builds and publishes ghcr.io/<owner>/<repo> only when needed:
#   - weekly: if the official runner image has a newer version than the newest one built here;
#   - push to master changing the image (Dockerfile, rootfs/, scripts, this workflow): always;
#   - workflow_dispatch: like the weekly run, or always with "force".
# Otherwise the job ends right after the version check.
on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - rootfs/**
      - .github/scripts/**
      - .github/workflows/build-image.yml
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Build even if the newest upstream version is already built
        type: boolean
        default: false

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: ghcr.io/actions/actions-runner

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Compare the upstream version with the built one
        id: versions
        env:
          # A change to the image definition is always built.
          FORCE: ${{ github.event_name == 'push' || inputs.force == true }}
        run: .github/scripts/resolve-versions.sh "ghcr.io/${GITHUB_REPOSITORY,,}"

      - name: Summary
        env:
          UPSTREAM_VERSION: ${{ steps.versions.outputs.upstream }}
          BUILT_VERSION: ${{ steps.versions.outputs.built }}
          BUILD: ${{ steps.versions.outputs.build }}
        run: |
          echo "Upstream: \`$UPSTREAM:$UPSTREAM_VERSION\` · built: \`${BUILT_VERSION:-none}\` · build: **$BUILD**" >> "$GITHUB_STEP_SUMMARY"

      - uses: docker/setup-buildx-action@v4
        if: steps.versions.outputs.build == 'true'

      - name: Upstream image digest
        if: steps.versions.outputs.build == 'true'
        id: base
        env:
          RUNNER_VERSION: ${{ steps.versions.outputs.upstream }}
        run: |
          digest="$(docker buildx imagetools inspect "$UPSTREAM:$RUNNER_VERSION" --format '{{json .Manifest}}' | jq -r .digest)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Image metadata
        if: steps.versions.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.versions.outputs.upstream }}
            type=raw,value=${{ steps.versions.outputs.upstream }}-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=actions-runner
            org.opencontainers.image.description=Self-hosted GitHub Actions runner image based on the official runner image, with extra build tooling
            org.opencontainers.image.version=${{ steps.versions.outputs.upstream }}
            org.opencontainers.image.base.name=${{ env.UPSTREAM }}:${{ steps.versions.outputs.upstream }}
            org.opencontainers.image.base.digest=${{ steps.base.outputs.digest }}

      - name: Build for testing
        if: steps.versions.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: RUNNER_VERSION=${{ steps.versions.outputs.upstream }}
          load: true
          tags: image-under-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.versions.outputs.build == 'true'
        env:
          RUNNER_VERSION: ${{ steps.versions.outputs.upstream }}
        run: |
          docker run --rm -e EXPECTED="$RUNNER_VERSION" --entrypoint bash image-under-test -c '
            set -euo pipefail
            test "$(id -un)" = runner
            actual="$(./config.sh --version 2>/dev/null | grep -Ex "[0-9]+\.[0-9]+\.[0-9]+" | tail -1)"
            echo "runner $actual"; test "$actual" = "$EXPECTED"
            java -version
            python3 --version
            ensure-android-sdk
            adb version
            ensure-android-sdk   # second run is a no-op
          '

      - uses: docker/login-action@v4
        if: steps.versions.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        if: steps.versions.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: RUNNER_VERSION=${{ steps.versions.outputs.upstream }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
