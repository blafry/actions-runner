name: Build image

# Builds and publishes ghcr.io/<owner>/<repo>:
#   - on pushes to master that change the image (Dockerfile, rootfs/, this workflow),
#   - weekly, but only when GitHub has published a new upstream runner image,
#   - on demand (workflow_dispatch; "force" rebuilds even if nothing changed upstream).
on:
  push:
    branches: [master]
    paths:
      - Dockerfile
      - rootfs/**
      - .github/workflows/build-image.yml
  schedule:
    - cron: "23 4 * * 1" # Mondays 04:23 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the upstream image did not change
        type: boolean
        default: false

concurrency:
  group: build-image
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  UPSTREAM: ghcr.io/actions/actions-runner

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Resolve the upstream runner image
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version="$(gh api repos/actions/runner/releases/latest --jq '.tag_name | ltrimstr("v")')"
          digest="$(docker buildx imagetools inspect "$UPSTREAM:$version" --format '{{json .Manifest}}' | jq -r .digest)"
          # The base digest recorded on our image for this version, if it exists.
          ours="$(docker buildx imagetools inspect "$image:$version" --format '{{json .Image}}' 2>/dev/null \
            | jq -r '.config.Labels["org.opencontainers.image.base.digest"] // empty' || true)"
          build=true
          if [[ "$EVENT" == "schedule" && "$ours" == "$digest" ]]; then build=false; fi
          if [[ "$FORCE" == "true" ]]; then build=true; fi
          {
            echo "image=$image"
            echo "version=$version"
            echo "digest=$digest"
            echo "build=$build"
          } >> "$GITHUB_OUTPUT"
          echo "Upstream $UPSTREAM:$version ($digest); published base: ${ours:-none}; build: $build" >> "$GITHUB_STEP_SUMMARY"

      - name: Image metadata
        if: steps.upstream.outputs.build == 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.upstream.outputs.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.upstream.outputs.version }}
            type=raw,value=${{ steps.upstream.outputs.version }}-{{date 'YYYYMMDD'}}
          labels: |
            org.opencontainers.image.title=actions-runner
            org.opencontainers.image.description=Self-hosted GitHub Actions runner image based on the official runner image, with extra build tooling
            org.opencontainers.image.base.name=${{ env.UPSTREAM }}:${{ steps.upstream.outputs.version }}
            org.opencontainers.image.base.digest=${{ steps.upstream.outputs.digest }}

      - name: Build for testing
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: RUNNER_VERSION=${{ steps.upstream.outputs.version }}
          load: true
          tags: image-under-test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        if: steps.upstream.outputs.build == 'true'
        run: |
          docker run --rm --entrypoint bash image-under-test -c '
            set -euo pipefail
            test "$(id -un)" = runner
            java -version
            python3 --version
            test -x ./run.sh
            ensure-android-sdk
            adb version
            ensure-android-sdk   # second run is a no-op
          '

      - uses: docker/login-action@v4
        if: steps.upstream.outputs.build == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        if: steps.upstream.outputs.build == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          build-args: RUNNER_VERSION=${{ steps.upstream.outputs.version }}
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
